name: Bug report
description: Report a reproducible Samsarix Story Studio defect without including secrets or private story text.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Before filing, search existing issues. Report vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Deterministic demo
        - Provider-backed generation
        - Local JSON storage
        - MySQL storage
        - Build or development tooling
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node.js version, pnpm version, browser, and relevant non-secret configuration
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove API keys, connection strings, local paths you consider sensitive, and private story content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private story content, and this is not an unpatched security report.
          required: true
